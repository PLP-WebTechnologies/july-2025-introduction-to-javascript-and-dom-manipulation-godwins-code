<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winagode Sytems</title>
    <link rel="stylesheet" href="style.css"> <!-- Optional CSS file -->
</head>

<body>
    <header>
        <h1>Winagode Sytems</h1>
    </header>

    <main>
        <section id="part1">
            <h2>Winagode Login</h2>
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Name">
            <button id="greetButton">Enter</button>
            <p id="greeting"></p>
        </section>

        <section id="part2">
            <h2>Winagode Business</h2>
            <label for="profit">Profit:</label>
            <input type="number" id="profit">
            <label for="bonus">Bonus:</label>
            <input type="number" id="bonus">
            <button id="totalIncomeButton">Total Income:</button>
            <p id="totalIncome"></p>
        </section>

        <section id="part3">
            <h2>Part 3: Loops</h2>
            <ul id="loopList"></ul>
        </section>

        <section id="part4">
            <h2>Part 4: DOM Manipulation</h2>
            <button id="toggleButton">Toggle Class</button>
            <div id="toggleTarget">This element will have its class toggled.</div>
            <ul id="dynamicList"></ul>
            <button id="addButton">Add List Item</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Your Name</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
